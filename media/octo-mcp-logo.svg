<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OCTO MCP">
  <title>OCTO MCP</title>
  <!-- compass dial -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#1C4A41" stroke-width="2"/>
  <!-- 8-point compass rose = 8 nodes (octo) : travel + network -->
  <path fill="#C0492A" d="M32,7 L34.1,26.9 L41.2,22.8 L37.1,29.9 L57,32 L37.1,34.1 L41.2,41.2 L34.1,37.1 L32,57 L29.9,37.1 L22.8,41.2 L26.9,34.1 L7,32 L26.9,29.9 L22.8,22.8 L29.9,26.9 Z"/>
  <!-- orbiting waypoint = the agent / connection -->
  <circle cx="52.51" cy="11.49" r="3" fill="#D58A1E"/>
  <!-- hub = the one MCP server -->
  <circle cx="32" cy="32" r="4.4" fill="#F3EAD8" stroke="#1C4A41" stroke-width="2"/>
</svg>
